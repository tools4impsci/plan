<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50 antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ImpSci Navigator: IRLM Auto-Generator</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], },
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e', }
                    },
                    boxShadow: { 'glass': '0 4px 6px -1px rgba(0, 0, 0, 0.05)', 'float': '0 10px 25px -5px rgba(0, 0, 0, 0.1)' }
                }
            }
        }
    </script>

    <style>
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .matrix-bg { background-color: #ffffff; background-image: linear-gradient(rgba(15, 23, 42, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(15, 23, 42, 0.03) 1px, transparent 1px); background-size: 40px 40px; }
        .vertical-text-left { transform: rotate(-90deg); white-space: nowrap; display: block; }
        .vertical-text-right { transform: rotate(90deg); white-space: nowrap; display: block; }
        .sidebar-transition { transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden text-slate-900" x-data="prepApp" x-init="init()">

    <div x-show="!project.initialized" class="fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 no-print" x-cloak>
        <div class="bg-white rounded-2xl shadow-float max-w-lg w-full p-8 relative overflow-hidden">
            <h2 class="text-2xl font-extrabold mb-2">Configure Project</h2>
            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Innovation</label>
                    <input type="text" x-model="project.innovation" class="w-full border border-slate-300 rounded-lg p-3 bg-slate-50 outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Setting</label>
                    <input type="text" x-model="project.setting" class="w-full border border-slate-300 rounded-lg p-3 bg-slate-50 outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <button @click="project.initialized = true" :disabled="!project.innovation || !project.setting" class="w-full bg-brand-600 text-white font-bold py-3.5 rounded-lg disabled:opacity-50">Initialize Workspace</button>
            </div>
        </div>
    </div>

    <div x-show="strategyModal.open" class="fixed inset-0 z-[150] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4 no-print" x-cloak>
        <div class="bg-white rounded-2xl shadow-float max-w-2xl w-full p-8 max-h-[90vh] overflow-y-auto">
            <h2 class="text-xl font-bold mb-4" x-text="strategyModal.strat?.text"></h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="col-span-2">
                    <label class="block text-[11px] font-bold uppercase mb-1">Targeted Proctor Outcome</label>
                    <select x-model="strategyModal.outcome" class="w-full border rounded-lg p-2.5 text-sm">
                        <option value="Acceptability">Acceptability</option>
                        <option value="Appropriateness">Appropriateness</option>
                        <option value="Feasibility">Feasibility</option>
                        <option value="Adoption">Adoption</option>
                        <option value="Fidelity">Fidelity</option>
                        <option value="Sustainability">Sustainability</option>
                    </select>
                </div>
                <div><label class="block text-[11px] font-bold uppercase mb-1">Actor</label><input type="text" x-model="strategyModal.actor" class="w-full border rounded-lg p-2.5 text-sm"></div>
                <div><label class="block text-[11px] font-bold uppercase mb-1">Target</label><input type="text" x-model="strategyModal.target" class="w-full border rounded-lg p-2.5 text-sm"></div>
                <div class="col-span-2"><label class="block text-[11px] font-bold uppercase mb-1">Mechanism / Justification</label><textarea x-model="strategyModal.justification" class="w-full border rounded-lg p-2.5 text-sm"></textarea></div>
            </div>
            <button @click="commitStrategy()" class="mt-6 w-full bg-slate-900 text-white font-bold py-3 rounded-lg">Add to IRLM Figure</button>
        </div>
    </div>

    <header class="h-[72px] bg-white border-b px-6 flex items-center justify-between shrink-0 no-print z-50">
        <div class="flex items-center gap-4">
            <div class="bg-brand-600 text-white p-2 rounded-lg"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg></div>
            <h1 class="text-lg font-bold">ImpSci Navigator <span class="text-slate-400 font-normal">| Auto-Logic Model</span></h1>
        </div>
        <div class="flex gap-3">
            <button @click="exportIRLM()" class="px-5 py-2.5 bg-brand-600 text-white rounded-lg text-xs font-bold uppercase shadow-md hover:bg-brand-700 transition-all flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                Export IRLM PNG
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">
        <aside :class="leftOpen ? 'w-[360px]' : 'w-0'" class="sidebar-transition bg-white border-r flex flex-col no-print shrink-0 relative z-40">
            <div x-show="leftOpen" class="flex flex-col h-full min-w-[360px] p-6 space-y-6 overflow-y-auto">
                <div class="space-y-4">
                    <label class="text-xs font-bold uppercase text-slate-500">Add Determinant (CFIR 2.0)</label>
                    <select x-model="newItem.construct" class="w-full border rounded-lg p-3 text-sm font-semibold">
                        <template x-for="(list, domain) in cfirTaxonomy" :key="domain">
                            <optgroup :label="domain">
                                <template x-for="item in list" :key="item">
                                    <option :value="item" x-text="item"></option>
                                </template>
                            </optgroup>
                        </template>
                    </select>
                    <div class="space-y-1">
                        <div class="flex justify-between text-[10px] font-bold"><span>Barrier</span><span>Facilitator</span></div>
                        <input type="range" x-model="newItem.rating" class="w-full accent-brand-600">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-[10px] font-bold">Impact (1-10)</label><input type="number" x-model="newItem.impact" class="w-full border rounded p-2 text-sm"></div>
                        <div><label class="text-[10px] font-bold">Feas. (1-10)</label><input type="number" x-model="newItem.feasibility" class="w-full border rounded p-2 text-sm"></div>
                    </div>
                    <textarea x-model="newItem.desc" placeholder="Qualitative evidence..." class="w-full border rounded-lg p-3 text-sm h-20"></textarea>
                    <button @click="addItem()" class="w-full bg-slate-900 text-white py-3 rounded-lg text-sm font-bold">Add to Assessment</button>
                </div>

                <div class="space-y-3">
                    <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest border-t pt-4">Evidence Matches (ERIC)</h3>
                    <div class="space-y-2">
                        <template x-for="strat in suggestedStrategies" :key="strat.text">
                            <button @click="openStrategyModal(strat)" class="w-full text-left p-3 rounded-lg bg-brand-50 border border-brand-100 hover:border-brand-500 transition-all flex justify-between items-center group">
                                <span class="text-xs font-bold text-slate-800" x-text="strat.text"></span>
                                <svg class="w-4 h-4 text-brand-400 group-hover:text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                            </button>
                        </template>
                    </div>
                </div>
            </div>
        </aside>

        <main class="flex-1 relative bg-slate-100 overflow-y-auto p-8">
            <div id="irlm-capture-area" class="bg-white rounded-xl shadow-xl border p-12 min-w-[1200px] mx-auto">
                <div class="mb-8 border-b-4 border-slate-900 pb-4 flex justify-between items-end">
                    <div>
                        <h2 class="text-3xl font-black text-slate-900 uppercase">Implementation Research Logic Model</h2>
                        <p class="text-brand-600 font-bold uppercase text-sm" x-text="`Innovation: ${project.innovation} | Setting: ${project.setting}`"></p>
                    </div>
                    <div class="text-right text-slate-400 font-bold text-xs uppercase">Generated: <span class="text-slate-900" x-text="new Date().toLocaleDateString()"></span></div>
                </div>

                <div class="flex items-stretch gap-4 min-h-[600px]">
                    <div class="flex-1 flex flex-col">
                        <h3 class="text-center font-bold mb-2 uppercase text-xs tracking-widest">Determinants</h3>
                        <div class="flex-1 border-2 border-slate-900 flex flex-col p-2 gap-2">
                            <template x-for="domain in Object.keys(cfirTaxonomy)">
                                <div class="flex-1 flex border border-slate-200 group min-h-[80px]">
                                    <div class="w-8 shrink-0 bg-slate-50 border-r flex items-center justify-center p-1 font-bold text-slate-500">
                                        <div class="vertical-text-left text-[9px] uppercase tracking-tighter" x-text="domain"></div>
                                    </div>
                                    <div class="flex-1 p-2 text-[11px] leading-tight space-y-1">
                                        <template x-for="item in items.filter(i => Object.values(cfirTaxonomy[domain]).includes(i.construct))">
                                            <div class="flex gap-1">
                                                <span :class="item.rating <= 49 ? 'text-rose-600' : 'text-emerald-600'">●</span>
                                                <span x-text="`${item.construct}: ${item.desc}`"></span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <div class="flex items-center"><svg class="w-6 h-6 text-slate-300" fill="currentColor" viewBox="0 0 20 20"><path d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"/></svg></div>

                    <div class="flex-1 flex flex-col">
                        <h3 class="text-center font-bold mb-2 uppercase text-xs tracking-widest">Strategies</h3>
                        <div class="flex-1 border-2 border-slate-900 p-4 space-y-4">
                            <template x-for="s in selectedStrategies">
                                <div class="p-3 bg-slate-50 border-l-4 border-brand-500 text-[11px]">
                                    <p class="font-bold text-slate-900" x-text="s.strat.text"></p>
                                    <p class="text-slate-500 italic" x-text="`${s.actor} → ${s.target}`"></p>
                                </div>
                            </template>
                        </div>
                    </div>

                    <div class="flex items-center"><svg class="w-6 h-6 text-slate-300" fill="currentColor" viewBox="0 0 20 20"><path d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"/></svg></div>

                    <div class="flex-1 flex flex-col">
                        <h3 class="text-center font-bold mb-2 uppercase text-xs tracking-widest">Mechanisms</h3>
                        <div class="flex-1 border-2 border-slate-900 p-4 space-y-4">
                            <template x-for="s in selectedStrategies">
                                <div class="p-3 border border-dashed border-slate-300 text-[11px] h-fit">
                                    <p x-text="s.justification"></p>
                                </div>
                            </template>
                        </div>
                    </div>

                    <div class="flex items-center"><svg class="w-6 h-6 text-slate-300" fill="currentColor" viewBox="0 0 20 20"><path d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"/></svg></div>

                    <div class="flex-1 flex flex-col">
                        <h3 class="text-center font-bold mb-2 uppercase text-xs tracking-widest">Outcomes</h3>
                        <div class="flex-1 border-2 border-slate-900 flex flex-col p-2 gap-2">
                             <div class="flex-1 border border-slate-200 p-2">
                                <p class="text-[9px] font-black uppercase text-slate-400 mb-1">Implementation</p>
                                <div class="flex flex-wrap gap-1">
                                    <template x-for="out in [...new Set(selectedStrategies.map(s => s.outcome))]">
                                        <span class="bg-brand-600 text-white px-2 py-0.5 rounded text-[10px] font-bold" x-text="out"></span>
                                    </template>
                                </div>
                             </div>
                             <div class="flex-1 border border-slate-200 p-2"><p class="text-[9px] font-black uppercase text-slate-400">Service</p></div>
                             <div class="flex-1 border border-slate-200 p-2"><p class="text-[9px] font-black uppercase text-slate-400">Clinical</p></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('prepApp', () => ({
                project: { innovation: '', setting: '', initialized: false },
                items: [],
                selectedStrategies: [],
                newItem: { desc: '', construct: 'Capability', rating: 50, impact: 5, feasibility: 5 },
                leftOpen: true,
                strategyModal: { open: false, strat: null, outcome: 'Fidelity', actor: '', target: '', justification: '' },
                
                cfirTaxonomy: {
                    "Innovation": ["Innovation Adaptability", "Innovation Complexity", "Design Quality"],
                    "Outer Setting": ["External Pressure", "Patient Needs", "Local Conditions"],
                    "Inner Setting": ["Tension for Change", "Compatibility", "Available Resources", "Readiness"],
                    "Individuals": ["Capability", "Motivation", "Self-Efficacy"],
                    "Process": ["Teaming", "Engaging", "Planning"]
                },

                ericMapping: {
                    "Capability": [{ text: "Conduct localized educational meetings", cluster: "Train", consensus: 85 }, { text: "Provide clinical supervision", cluster: "Support", consensus: 70 }],
                    "Innovation Complexity": [{ text: "Develop educational materials", cluster: "Train", consensus: 82 }],
                    "Available Resources": [{ text: "Access new external funding", cluster: "Finance", consensus: 81 }]
                },

                init() {},

                addItem() {
                    this.items.push({...this.newItem, id: Date.now()});
                    this.newItem.desc = '';
                },

                openStrategyModal(strat) {
                    this.strategyModal = { open: true, strat, outcome: 'Fidelity', actor: '', target: '', justification: '' };
                },

                commitStrategy() {
                    this.selectedStrategies.push(JSON.parse(JSON.stringify(this.strategyModal)));
                    this.strategyModal.open = false;
                },

                get suggestedStrategies() {
                    const active = this.items.filter(i => i.rating <= 49).map(i => i.construct);
                    let res = [];
                    active.forEach(c => { if(this.ericMapping[c]) res = [...res, ...this.ericMapping[c]]; });
                    return res.slice(0, 5);
                },

                async exportIRLM() {
                    const area = document.getElementById('irlm-capture-area');
                    const dataUrl = await htmlToImage.toPng(area, { pixelRatio: 2, backgroundColor: '#ffffff' });
                    const link = document.createElement('a');
                    link.download = `IRLM_${this.project.innovation || 'Figure'}.png`;
                    link.href = dataUrl;
                    link.click();
                }
            }));
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</body>
</html>
