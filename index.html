<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50 antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ImpSci Navigator: Matrix & IRLM</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1' } }
                }
            }
        }
    </script>

    <style>
        [x-cloak] { display: none !important; }
        .matrix-bg { 
            background-color: #ffffff; 
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 25px 25px; 
        }
        .vertical-text { transform: rotate(-90deg); white-space: nowrap; display: block; }
        .sidebar-transition { transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* Pulse animation for sidebar-matrix sync */
        .node-pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0% { r: 14; stroke-opacity: 1; }
            50% { r: 18; stroke-opacity: 0.5; }
            100% { r: 14; stroke-opacity: 1; }
        }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden text-slate-900" x-data="prepApp" x-init="init()">

    <header class="h-[72px] bg-white border-b px-6 flex items-center justify-between shrink-0 z-50">
        <div class="flex items-center gap-4">
            <div class="bg-brand-600 text-white p-2 rounded-xl">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
            </div>
            <div>
                <h1 class="text-base font-bold leading-none">ImpSci Navigator</h1>
                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest mt-1">Matrix + Auto-IRLM Generator</p>
            </div>
        </div>
        <div class="flex gap-3">
            <button @click="exportIRLM()" class="px-5 py-2.5 bg-slate-900 text-white rounded-lg text-xs font-bold uppercase hover:bg-slate-800 transition-all flex items-center gap-2 shadow-md">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                Export IRLM Figure
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <aside class="w-[380px] bg-white border-r flex flex-col shrink-0 custom-scroll overflow-y-auto p-6 space-y-8">
            <section class="space-y-4">
                <h3 class="text-xs font-black uppercase text-brand-600 tracking-widest">Context Assessment</h3>
                <div class="space-y-3">
                    <select x-model="newItem.construct" class="w-full border rounded-lg p-3 text-sm font-semibold bg-slate-50">
                        <template x-for="(list, domain) in cfirTaxonomy" :key="domain">
                            <optgroup :label="domain">
                                <template x-for="item in list" :key="item"><option :value="item" x-text="item"></option></template>
                            </optgroup>
                        </template>
                    </select>
                    <textarea x-model="newItem.desc" placeholder="Evidence..." class="w-full border rounded-lg p-3 text-sm h-20 bg-slate-50 outline-none focus:border-brand-500"></textarea>
                    <button @click="addItem()" class="w-full bg-slate-900 text-white py-3 rounded-lg text-sm font-bold shadow-lg">Plot Construct</button>
                </div>
            </section>

            <section class="space-y-3">
                <h3 class="text-xs font-black uppercase text-slate-400 tracking-widest">Mapped Determinants</h3>
                <template x-for="(item, index) in items" :key="item.id">
                    <div @mouseenter="hoveredId = item.id" @mouseleave="hoveredId = null" 
                         class="p-3 border rounded-xl text-[11px] relative group transition-colors"
                         :class="hoveredId === item.id ? 'border-brand-500 bg-brand-50' : 'bg-white'">
                        <button @click="items.splice(index, 1); renderMatrix()" class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-500">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                        <span class="font-bold text-slate-900" x-text="item.construct"></span>
                        <p class="text-slate-500 mt-1" x-text="item.desc"></p>
                    </div>
                </template>
            </section>

            <section class="space-y-4 pt-6 border-t">
                <h3 class="text-xs font-black uppercase text-slate-500 tracking-widest">Evidence Matches</h3>
                <div class="space-y-2">
                    <template x-for="strat in suggestedStrategies" :key="strat.text">
                        <button @click="openStrategyModal(strat)" class="w-full text-left p-3 rounded-xl bg-brand-50 border border-brand-100 hover:border-brand-500 transition-all flex justify-between items-center group">
                            <div class="pr-2">
                                <p class="text-[11px] font-bold text-slate-800 leading-tight" x-text="strat.text"></p>
                                <p class="text-[9px] text-brand-600 font-bold mt-1" x-text="strat.cluster"></p>
                            </div>
                            <svg class="w-4 h-4 text-brand-400 group-hover:text-brand-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
                        </button>
                    </template>
                </div>
            </section>
        </aside>

        <main class="flex-1 overflow-y-auto bg-slate-100 p-8 space-y-8 custom-scroll">
            
            <div class="bg-white rounded-2xl shadow-sm border overflow-hidden flex flex-col h-[550px] matrix-bg relative">
                <div class="px-6 py-4 border-b bg-white/90 backdrop-blur-md z-10 flex justify-between items-center">
                    <div>
                        <h2 class="text-sm font-bold text-slate-900 uppercase">Prioritization Matrix</h2>
                        <p class="text-[10px] text-slate-400 font-bold">Y = Feasibility | X = Impact</p>
                    </div>
                    <div class="flex gap-4 text-[9px] font-bold uppercase">
                        <span class="text-slate-400">Drag nodes to re-prioritize</span>
                    </div>
                </div>
                <div id="matrix" class="flex-1 relative overflow-hidden"></div>
            </div>

            <div id="irlm-figure" class="bg-white rounded-2xl shadow-xl border p-12 min-w-[1000px] mx-auto">
                <div class="mb-8 border-b-4 border-slate-900 pb-4 flex justify-between items-end">
                    <h2 class="text-2xl font-black text-slate-900 uppercase italic">Implementation Research Logic Model</h2>
                    <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">CFIR 2.0 & ERIC Integration</div>
                </div>
                <div class="flex items-stretch gap-4 min-h-[450px]">
                    <div class="flex-1 flex flex-col">
                        <div class="text-center font-black text-[10px] mb-2 uppercase bg-slate-900 text-white py-1">Determinants</div>
                        <div class="flex-1 border-2 border-slate-900 flex flex-col p-1 gap-1">
                            <template x-for="(list, domain) in cfirTaxonomy" :key="domain">
                                <div class="flex-1 flex border border-slate-100 min-h-[60px]">
                                    <div class="w-6 shrink-0 bg-slate-50 border-r flex items-center justify-center">
                                        <span class="vertical-text text-[8px] font-black uppercase text-slate-400" x-text="domain"></span>
                                    </div>
                                    <div class="flex-1 p-2 text-[10px] leading-tight space-y-1">
                                        <template x-for="item in items.filter(i => list.includes(i.construct))">
                                            <div class="flex gap-1.5"><span :class="item.impact > 5 ? 'font-bold' : ''" x-text="`${item.construct}: ${item.desc}`"></span></div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                    <div class="flex-1 flex flex-col"><div class="text-center font-black text-[10px] mb-2 uppercase bg-slate-900 text-white py-1">Strategies</div>
                        <div class="flex-1 border-2 border-slate-900 p-3 space-y-3">
                            <template x-for="s in selectedStrategies"><div class="p-2 bg-slate-50 border-l-2 border-brand-500 text-[10px]"><p class="font-bold" x-text="s.strat.text"></p></div></template>
                        </div>
                    </div>
                    <div class="flex-1 flex flex-col"><div class="text-center font-black text-[10px] mb-2 uppercase bg-slate-900 text-white py-1">Mechanisms</div>
                        <div class="flex-1 border-2 border-slate-900 p-3 space-y-3">
                            <template x-for="s in selectedStrategies"><div class="p-2 border border-dashed text-[10px]" x-text="s.justification"></div></template>
                        </div>
                    </div>
                    <div class="flex-1 flex flex-col"><div class="text-center font-black text-[10px] mb-2 uppercase bg-slate-900 text-white py-1">Outcomes</div>
                        <div class="flex-1 border-2 border-slate-900 flex flex-col p-2">
                             <div class="flex flex-wrap gap-1">
                                <template x-for="out in [...new Set(selectedStrategies.map(s => s.outcome))]">
                                    <span class="bg-brand-500 text-white px-1.5 py-0.5 rounded-[2px] text-[9px] font-bold" x-text="out"></span>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div x-show="strategyModal.open" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4" x-cloak>
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-8">
            <h2 class="text-xl font-bold mb-4" x-text="strategyModal.strat?.text"></h2>
            <div class="space-y-4">
                <div><label class="block text-[10px] font-bold uppercase mb-1">Mechanism (Logic)</label><textarea x-model="strategyModal.justification" class="w-full border rounded-lg p-2.5 text-sm h-20 outline-none focus:border-brand-500"></textarea></div>
                <button @click="commitStrategy()" class="w-full py-3 bg-brand-600 text-white text-sm font-bold rounded-lg shadow-lg">Confirm Strategy</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('prepApp', () => ({
                items: [],
                selectedStrategies: [],
                hoveredId: null,
                newItem: { construct: 'Capability', impact: 5, feasibility: 5, desc: '' },
                strategyModal: { open: false, strat: null, outcome: 'Fidelity', actor: 'Implementation Team', target: 'Staff', justification: '' },
                cfirTaxonomy: {
                    "Innovation": ["Innovation Adaptability", "Innovation Complexity", "Design Quality"],
                    "Outer Setting": ["External Pressure", "Patient Needs", "Local Conditions"],
                    "Inner Setting": ["Tension for Change", "Compatibility", "Available Resources"],
                    "Individuals": ["Capability", "Motivation", "Self-Efficacy"],
                    "Process": ["Teaming", "Engaging", "Planning"]
                },
                ericMapping: {
                    "Capability": [{ text: "Conduct localized educational meetings", cluster: "Train" }, { text: "Provide clinical supervision", cluster: "Support" }],
                    "Innovation Complexity": [{ text: "Develop educational materials", cluster: "Train" }],
                    "Available Resources": [{ text: "Access new external funding", cluster: "Finance" }]
                },

                init() {
                    this.renderMatrix();
                    window.addEventListener('resize', () => this.renderMatrix());
                    this.$watch('hoveredId', () => this.updateHighlights());
                },

                addItem() {
                    this.items.push({ ...this.newItem, id: Date.now() });
                    this.newItem.desc = '';
                    this.renderMatrix();
                },

                commitStrategy() {
                    this.selectedStrategies.push(JSON.parse(JSON.stringify(this.strategyModal)));
                    this.strategyModal.open = false;
                },

                get suggestedStrategies() {
                    const active = this.items.filter(i => i.impact > 5).map(i => i.construct);
                    let res = [];
                    active.forEach(c => { if(this.ericMapping[c]) res = [...res, ...this.ericMapping[c]]; });
                    return res.slice(0, 4);
                },

                renderMatrix() {
                    const container = document.getElementById('matrix');
                    if (!container) return;
                    container.innerHTML = '';
                    
                    const width = container.clientWidth;
                    const height = container.clientHeight;
                    const margin = 60;

                    const svg = d3.select("#matrix").append("svg")
                        .attr("width", width)
                        .attr("height", height)
                        .attr("viewBox", `0 0 ${width} ${height}`);

                    const x = d3.scaleLinear().domain([0, 10]).range([margin, width - margin]);
                    const y = d3.scaleLinear().domain([0, 10]).range([height - margin, margin]);

                    // Grid Lines
                    svg.append("line").attr("x1", x(5)).attr("y1", margin).attr("x2", x(5)).attr("y2", height-margin).attr("stroke", "#f1f5f9").attr("stroke-width", 2);
                    svg.append("line").attr("x1", margin).attr("y1", y(5)).attr("x2", width-margin).attr("y2", y(5)).attr("stroke", "#f1f5f9").attr("stroke-width", 2);

                    const drag = d3.drag()
                        .container(container) // FIX: Normalizes coordinates to this container
                        .on("start", function() { d3.select(this).raise(); })
                        .on("drag", (event, d) => {
                            // Convert mouse position directly to domain values
                            d.impact = Math.max(0, Math.min(10, x.invert(event.x)));
                            d.feasibility = Math.max(0, Math.min(10, y.invert(event.y)));
                            
                            // Visual update only (performance)
                            d3.select(`#node-${d.id}`)
                                .attr("transform", `translate(${x(d.impact)},${y(d.feasibility)})`);
                        })
                        .on("end", () => {
                            this.$nextTick(() => this.renderMatrix()); // Re-sync Figure data
                        });

                    const nodes = svg.selectAll(".node").data(this.items).enter().append("g")
                        .attr("id", d => `node-${d.id}`)
                        .attr("class", "node cursor-grab active:cursor-grabbing")
                        .attr("transform", d => `translate(${x(d.impact)},${y(d.feasibility)})`)
                        .call(drag);

                    nodes.append("circle")
                        .attr("r", 14)
                        .attr("fill", d => d.impact > 5 ? "#e11d48" : "#0ea5e9")
                        .attr("stroke", "#fff")
                        .attr("stroke-width", 3)
                        .attr("class", d => this.hoveredId === d.id ? "node-pulse" : "");

                    nodes.append("text")
                        .text(d => d.construct.split(" ")[0])
                        .attr("y", 28)
                        .attr("text-anchor", "middle")
                        .style("font-size", "10px")
                        .style("font-weight", "800")
                        .style("fill", "#1e293b");
                },

                updateHighlights() {
                    d3.selectAll("circle")
                        .attr("class", d => d.id === this.hoveredId ? "node-pulse" : "")
                        .attr("stroke-width", d => d.id === this.hoveredId ? 5 : 3);
                },

                async exportIRLM() {
                    const el = document.getElementById('irlm-figure');
                    const dataUrl = await htmlToImage.toPng(el, { pixelRatio: 3, backgroundColor: '#ffffff' });
                    const link = document.createElement('a');
                    link.download = `IRLM_Figure.png`;
                    link.href = dataUrl;
                    link.click();
                }
            }));
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</body>
</html>
